<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>$paper_name</title>
<link rel="icon" href="$favicon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Libre+Franklin:wght@400;500;600&display=swap">
<style>
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
[hidden] { display: none !important; }
$css
</style>
</head>
<body>
<div class="sheet">
  <header class="masthead">
    <div class="ear">
      <div class="ear-label">Today's editions</div>
      <div class="editions" role="group" aria-label="Choose edition">$edition_buttons</div>
    </div>
    <div class="nameplate-wrap">$emblem<h1 class="nameplate">$paper_name</h1></div>
    <div class="ear right">$weather_ear</div>
  </header>

  <div class="dateline">
    <span><b>$date_line</b> · $location</span>
    <span id="edition-line" class="flagtxt">$edition_line</span>
    <span>$next_line</span>
  </div>
  $status

  $watch

  <div class="front">
    $front
    <aside class="weather-col" aria-label="Weather">
      <div class="sect-head"><h2>Weather</h2><span class="srcs">$location</span></div>
      $weather_panel
    </aside>
  </div>

  $groups

  <footer class="colophon">
    <span>Collated from news feeds at $schedule, Melbourne time</span>
    <span>Headlines only. Every story opens on its original site.</span>
  </footer>
</div>
<script>
document.querySelectorAll(".editions button[data-edition]").forEach(function (button) {
  button.addEventListener("click", function () {
    var ed = button.getAttribute("data-edition");
    document.querySelectorAll(".feed[data-ed]").forEach(function (el) { el.hidden = el.getAttribute("data-ed") !== ed; });
    document.querySelectorAll(".editions button[data-edition]").forEach(function (b) { b.setAttribute("aria-pressed", String(b === button)); });
    document.getElementById("edition-line").textContent = button.getAttribute("data-line");
  });
});

// Sport pages: one sport at a time, remembering the last one you opened on this device.
function showTab(slug) {
  var found = false;
  document.querySelectorAll(".tabs button[data-tab]").forEach(function (b) {
    var on = b.getAttribute("data-tab") === slug;
    found = found || on;
    b.setAttribute("aria-selected", String(on));
  });
  if (!found) return;
  document.querySelectorAll(".tab-panel[data-panel]").forEach(function (p) { p.hidden = p.getAttribute("data-panel") !== slug; });
  try { localStorage.setItem("sentinel-sport", slug); } catch (e) {}
}
document.querySelectorAll(".tabs button[data-tab]").forEach(function (b) {
  b.addEventListener("click", function () { showTab(b.getAttribute("data-tab")); });
});
try { var saved = localStorage.getItem("sentinel-sport"); if (saved) showTab(saved); } catch (e) {}
</script>
</body>
</html>
