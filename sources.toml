# ================================================================ Scores & tables
#
# Each box appears on the sport page named by `tab`. ESPN's data isn't an official
# public service and could change; if a box breaks, only that box disappears.
# kind = espn_table | espn_scores | espn_race | squiggle_table | cricket_live

[[scores]]
tab = "Football"
title = "Premier League table"
kind = "espn_table"
url = "https://site.api.espn.com/apis/v2/sports/soccer/eng.1/standings"
rows = 8
highlight = "Manchester United"
columns = [["P", "gamesPlayed"], ["GD", "pointDifferential"], ["Pts", "points"]]
more_url = "https://www.bbc.com/sport/football/premier-league/table"
more_label = "Full table"

[[scores]]
tab = "Football"
title = "Premier League"
kind = "espn_scores"
url = "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard"
rows = 6

[[scores]]
