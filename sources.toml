title = "NRL ladder"
kind = "espn_table"
url = "https://site.api.espn.com/apis/v2/sports/rugby-league/3/standings"
rows = 8
columns = [["P", "gamesPlayed"], ["PD", "pointsDifference"], ["Pts", "points"]]
more_url = "https://www.nrl.com/ladder/"
more_label = "Full ladder"

[[scores]]
