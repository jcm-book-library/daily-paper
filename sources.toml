# The Overnight Sentinel: sources and settings.
#
# To add a source, copy a [[section.feed]] block under the section it belongs to.
# Feeds are listed in priority order: when two outlets run the same story, the
# first one listed becomes the headline and the others appear as "Also covered by".
#
# Optional per-feed settings:
#   include = ["NRL", "rugby league"]   keep only stories mentioning one of these (headline + summary)
#   exclude = ["live blog", "quiz"]     drop stories mentioning any of these
#   category = "Sport"                  keep only stories the feed itself tags with this category
#   format = "espn"                     the source is ESPN's news data rather than an RSS feed
#
# Matching is case-insensitive and finds words inside longer words, so pick
# filter words that can't appear by accident ("test" would also match "latest").

[paper]
name = "The Overnight Sentinel"
location = "Melbourne"
timezone = "Australia/Melbourne"
latitude = -37.81
longitude = 144.96
bom_url = "https://www.bom.gov.au/location/australia/victoria/central/bvic_pt042-melbourne"
max_age_hours = 36        # ignore stories older than this (a section can set its own)

# Argus Watch: a band across the top of the front page for the day's biggest stories.
# It takes stories several outlets are running first, then tops up with the first
# news feed's highest-ranked stories (ABC Top Stories lists them in editorial order).
watch_title = "Argus Watch"
watch_limit = 3

# BOM warnings shown at the top of Argus Watch. Only warnings of these kinds
# (include) for these areas (require) appear, so flood warnings for distant
# rivers and marine forecasts stay out.
[alerts]
url = "https://www.bom.gov.au/fwo/IDZ00059.warnings_vic.xml"
include = ["severe thunderstorm", "severe weather", "fire weather", "total fire ban", "extreme heat", "heatwave"]
require = ["central", "melbourne", "port phillip"]


# ================================================================ News (front page)

[[section]]
title = "News"
group = "front"
limit = 12

  [[section.feed]]
  name = "ABC"
  url = "https://www.abc.net.au/news/feed/51120/rss.xml"   # ABC Top Stories

  [[section.feed]]
  name = "SBS"
  url = "https://www.sbs.com.au/news/topic/latest/feed"

  [[section.feed]]
  name = "Guardian"
  url = "https://www.theguardian.com/world/rss"

  [[section.feed]]
  name = "BBC"
  url = "https://feeds.bbci.co.uk/news/world/rss.xml"

  [[section.feed]]
  name = "Al Jazeera"
  url = "https://www.aljazeera.com/xml/rss/all.xml"
  category = "News"


# ================================================================ Sport
#
# Sections with group = "Sport" share the Sport heading. Each `tab` becomes its own
# page with a button; sections with the same tab appear side by side on that page.
# Sport news is slower than general news, so these sections look back four days.

# ---------------------------------------------------------------- Football

[[section]]
title = "Football"
group = "Sport"
tab = "Football"
limit = 6
max_age_hours = 96

  [[section.feed]]
  name = "BBC Sport"
  url = "https://feeds.bbci.co.uk/sport/football/rss.xml"

  [[section.feed]]
  name = "ESPN"
  url = "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/news"
  format = "espn"

  [[section.feed]]
  name = "Guardian"
  url = "https://www.theguardian.com/football/rss"

[[section]]
title = "Manchester United"
