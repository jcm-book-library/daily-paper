name: Print the paper

on:
  schedule:
    # Editions are 6am, 12pm and 6pm Melbourne time. GitHub schedules run in UTC,
    # so each edition is listed for both AEDT (UTC+11) and AEST (UTC+10), ten
    # minutes early to allow for GitHub's queue delays. build.py works out which
    # edition each run belongs to; the extra run each time just refreshes it.
    - cron: "50 18,19 * * *"   # morning
    - cron: "50 0,1 * * *"     # afternoon
    - cron: "50 6,7 * * *"     # evening
  workflow_dispatch:           # "Run workflow" button for an on-demand edition
  push:                        # every push: run the tests and a trial build, no publish

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: TEMP probe radar, APIs and blocked sites
        run: |
          python - <<'PY'
          import json, urllib.request, urllib.error, ftplib, re
          UA = {"User-Agent": "daily-paper/1.0 (+https://github.com/jcm-book-library/daily-paper)"}
          def get(u, t=20):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=t)
                  return r.status, r.headers.get("content-type", ""), r.read()
              except urllib.error.HTTPError as e:
                  return e.code, "", b""
              except Exception as e:
                  return 0, str(e)[:80], b""
          print("##### RADAR")
          st, ct, b = get("https://api.rainviewer.com/public/weather-maps.json")
          print("rainviewer index:", st, ct)
          if st == 200:
              d = json.loads(b); past = d.get("radar", {}).get("past", []); now = d.get("radar", {}).get("nowcast", [])
              print("  host:", d.get("host"), "| past frames:", len(past), "| nowcast frames:", len(now), "| keys:", list(d))
              if past:
                  print("  newest frame:", past[-1])
                  for z in (6, 7, 8):
                      u = f'{d["host"]}{past[-1]["path"]}/256/{z}/{{x}}/{{y}}/2/1_1.png'
                      import math
                      lat, lon = -37.81, 144.96; n = 2 ** z
                      x = int((lon + 180) / 360 * n); y = int((1 - math.log(math.tan(math.radians(lat)) + 1 / math.cos(math.radians(lat))) / math.pi) / 2 * n)
                      s2, c2, b2 = get(u.format(x=x, y=y))
                      print(f"  tile z{z}:", s2, c2, len(b2), "bytes")
          try:
              f = ftplib.FTP("ftp.bom.gov.au", timeout=20); f.login()
              names = f.nlst("/anon/gen/radar")
              mel = sorted(n for n in names if re.search(r"IDR02[1-4]\.T\.", n))
              print("BOM anon FTP radar: files:", len(names), "| Melbourne IDR021-024 frames:", len(mel), "| newest:", mel[-1] if mel else None)
              others = sorted(set(re.findall(r"(IDR\d+)\.T", " ".join(names))))
              print("  radar ids on FTP:", others[:40])
              f.quit()
          except Exception as e:
              print("BOM anon FTP: ERR", str(e)[:120])
          for u in ["http://www.bom.gov.au/products/IDR023.loop.shtml", "http://www.bom.gov.au/radar/IDR023.gif"]:
              s3, c3, b3 = get(u); print("BOM page", u, "->", s3, c3, len(b3))
          st, ct, b = get("https://api.open-meteo.com/v1/forecast?latitude=-37.81&longitude=144.96&minutely_15=precipitation&forecast_minutely_15=16&timezone=Australia%2FMelbourne")
          if st == 200:
              m = json.loads(b).get("minutely_15", {}); pr = m.get("precipitation", [])
              print("open-meteo minutely_15:", len(pr), "slots | any null:", any(v is None for v in pr), "| next 8:", pr[:8], m.get("time", [""])[:1])
          else: print("open-meteo minutely_15:", st)
          print("##### NEWS APIs")
          st, ct, b = get("https://content.guardianapis.com/search?section=world&page-size=3&show-fields=trailText&order-by=newest&api-key=test")
          if st == 200:
              r = json.loads(b)["response"]; print("guardian API (test key): status", r.get("status"), "| total:", r.get("total"))
              for x in r["results"][:3]: print("  -", x["webPublicationDate"], x["webTitle"][:70], "| trail:", (x.get("fields", {}).get("trailText") or "")[:50])
          else: print("guardian API:", st)
          for name, u in [("nyt (needs key)", "https://api.nytimes.com/svc/topstories/v2/world.json"), ("newsapi (needs key)", "https://newsapi.org/v2/top-headlines?country=au"),
                          ("gnews (needs key)", "https://gnews.io/api/v4/top-headlines?country=au"), ("football-data (needs key)", "https://api.football-data.org/v4/competitions/PL/standings")]:
              s4, c4, b4 = get(u); print(name, "->", s4, c4[:30], b4[:90])
          print("##### SPORT APIs")
          for name, u in [("jolpica F1", "https://api.jolpi.ca/ergast/f1/current/last/results.json"),
                          ("thesportsdb (free key)", "https://www.thesportsdb.com/api/v1/json/123/eventsnextleague.php?id=4328"),
                          ("squiggle games", "https://api.squiggle.com.au/?q=games;year=2026;round=1")]:
              s5, c5, b5 = get(u)
              extra = ""
              if s5 == 200:
                  try:
                      d = json.loads(b5); extra = str(list(d)[:4]) + " " + (str(len(next(iter(d.values()), []))) if isinstance(next(iter(d.values()), None), (list, dict)) else "")
                  except Exception: extra = "not json"
              print(name, "->", s5, c5[:30], extra)
          print("##### SITES THAT HAVE NO RSS (plain GET with an honest user agent, as a baseline)")
          for u in ["https://www.reuters.com/", "https://www.nrl.com/", "https://www.premierleague.com/", "https://www.manutd.com/en", "https://www.afl.com.au/"]:
              s6, c6, b6 = get(u, 15); print(u, "->", s6, c6[:30], len(b6), "bytes")
          for u in ["https://www.nrl.com/robots.txt", "https://www.premierleague.com/robots.txt", "https://www.afl.com.au/robots.txt", "https://www.reuters.com/robots.txt"]:
              s7, c7, b7 = get(u, 15)
              sm = re.findall(r"(?im)^sitemap:\s*(\S+)", b7.decode("utf8", "ignore")) if s7 == 200 else []
              print("robots", u, "->", s7, "| sitemaps:", sm[:6])
          PY
      - name: Fetch feeds and build the page
        run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publish:
    needs: build
    if: github.event_name != 'push' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
